XML

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5C9"/>
      <stop offset=".28" stop-color="#F6D778"/>
      <stop offset=".62" stop-color="#D69B27"/>
      <stop offset="1" stop-color="#8E5A0B"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183B60"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>

    <linearGradient id="whiteGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7C66C"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium background -->
  <rect width="512" height="512" rx="112" fill="#050D1B"/>
  <rect x="13" y="13" width="486" height="486" rx="101"
        fill="url(#shine)" stroke="url(#gold)" stroke-width="5"/>

  <!-- Decorative technology rings -->
  <circle cx="256" cy="218" r="155" fill="none"
          stroke="#D9A83F" stroke-opacity=".17" stroke-width="2"/>
  <circle cx="256" cy="218" r="139" fill="none"
          stroke="#F3D477" stroke-opacity=".25"
          stroke-width="2" stroke-dasharray="5 12"/>

  <!-- Digital connection points -->
  <g fill="url(#gold)">
    <circle cx="256" cy="55" r="5"/>
    <circle cx="408" cy="218" r="5"/>
    <circle cx="104" cy="218" r="5"/>
    <circle cx="256" cy="381" r="5"/>
  </g>

  <!-- GP monogram -->
  <g filter="url(#glow)">
    <path d="M224 117
             C169 117 133 157 133 218
             C133 279 171 319 225 319
             C263 319 292 300 309 270
             L267 247
             C257 265 245 274 226 274
             C197 274 180 252 180 218
             C180 184 198 162 226 162
             C245 162 259 171 267 187
             L310 164
             C292 133 263 117 224 117Z"
          fill="url(#gold)"/>

    <path d="M290 121 H350
             C397 121 421 146 421 187
             C421 229 394 253 350 253
             H337 V319 H290 Z
             M337 164 V210 H350
             C367 210 375 202 375 187
             C375 172 367 164 350 164Z"
          fill="url(#whiteGold)"/>
  </g>

  <!-- Payment card symbol -->
  <g transform="translate(170 337)">
    <rect x="0" y="0" width="172" height="78" rx="15"
          fill="#0A1A2D" stroke="url(#gold)" stroke-width="4"/>
    <path d="M3 24 H169" stroke="url(#gold)" stroke-width="9"/>
    <rect x="18" y="43" width="39" height="17" rx="5"
          fill="url(#gold)"/>
    <path d="M112 52 H151" stroke="#F6D778"
          stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="256" y="455" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="29"
        font-weight="800" letter-spacing="3"
        fill="url(#whiteGold)">GODIA PRIME</text>
  <text x="256" y="482" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="17"
        font-weight="700" letter-spacing="8"
        fill="#E6B94F">PAY</text>
</svg>
